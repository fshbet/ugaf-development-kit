[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugaf"
version = "1.0.0a5"
description = "Universal Game Automation Framework"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["gaming", "automation", "framework", "game-bot", "uaf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyyaml>=6.0",
    "structlog>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "black>=24.0",
    "mypy>=1.10",
]
input = [
    "pyautogui>=0.9",
    "keyboard>=0.13",
    "mouse>=0.7",
]
imaging = [
    "opencv-python>=4.9.0",
    "numpy>=1.26",
]
vision = [
    "ugaf[imaging]",
]
webapp = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/your-org/ugaf"
Repository = "https://github.com/your-org/ugaf"
Documentation = "https://ugaf.readthedocs.io/"
Changelog = "https://github.com/your-org/ugaf/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ugaf*"]

[tool.setuptools.package-data]
"ugaf" = ["py.typed"]
"ugaf.webapp" = ["static/*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.black]
target-version = ["py313"]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
