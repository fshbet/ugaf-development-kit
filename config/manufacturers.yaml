# Device profile library for the Emulator Manager (ugaf.emulator).
#
# Adding, removing, or editing a device here changes what UGAF's Android
# Emulator UI offers -- no Python or PowerShell code change is needed.
# Each entry becomes a ugaf.emulator.types.DeviceProfile.
#
# hardware_name is the avdmanager built-in device/skin profile closest to
# the real device (run `avdmanager list device` to see the full list).
manufacturers:
  Google:
    devices:
      pixel_9:
        brand: Google
        model: Pixel 9
        device_name: pixel_9
        hardware_name: pixel_9
        android_version: "Android 15"
        api_level: 35
        resolution: [1080, 2424]
        dpi: 422
        ram_mb: 4096
        cpu_count: 4
        storage_mb: 8192
        abi: x86_64
        gpu_mode: auto
        play_store: true
        snapshot_support: true
