logging:
  level: INFO
  json_format: false

input:
  provider: windows
  dry_run: false
  verbose: false
  delays:
    mouse: 0.01
    keyboard: 0.005
  retry:
    count: 3
    delay: 0.5
  timeout: 5.0
  adb:
    executable: adb
    default_device: null

imaging:
  backend: opencv
  default_format: png

vision:
  screenshot_provider: null
  template_match_method: ccorr_normed
  template_confidence: 0.9
  pixel_threshold: 30.0

device:
  adb:
    executable: adb
  monitor:
    enabled: false
    interval: 5.0
